name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saas_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/saas_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saas_test?schema=public
      STRIPE_WEBHOOK_SECRET: whsec_ci_test_only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Run isolation tests
        run: npm run test:isolation

      - name: Run server and webhook tests
        run: npm test -- tests/server.test.ts tests/api-error-handler.test.ts tests/stripe-webhook-signature.test.ts tests/supabase-auth.middleware.test.ts tests/development-auth.middleware.test.ts tests/prisma-tenant-extension.test.ts tests/student-workout.service.test.ts tests/student-workout.routes.test.ts tests/workout-execution.service.test.ts tests/workout-execution.routes.test.ts tests/workout-execution.e2e.test.ts tests/dashboard-metrics.service.test.ts tests/dashboard-metrics.routes.test.ts tests/dashboard-metrics.e2e.test.ts tests/personal-profile.service.test.ts tests/personal-profile.routes.test.ts tests/personal-profile.e2e.test.ts tests/billing-subscription.service.test.ts tests/billing-subscription.routes.test.ts tests/billing-subscription.e2e.test.ts
